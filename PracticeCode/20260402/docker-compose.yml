name: nginx-fastapi

services:
  fastapi:
    build: .
    container_name: fastapi_p8000
    ports:
      - '8000:8000'
    expose:
      - '8000'

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./index.html:/usr/share/nginx/html/index.html
    depends_on:
      - fastapi
