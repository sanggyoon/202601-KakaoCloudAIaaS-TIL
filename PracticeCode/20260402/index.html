<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>FastAPI + Nginx Test</title>
  </head>
  <body>
    <h1>Nginx + FastAPI 통신 연습</h1>
    <button onclick="fetchHello()">GET 요청 보내기</button>
    <button onclick="postItem()">POST 요청 보내기</button>
    <p id="result"></p>

    <script>
      async function fetchHello() {
        // Nginx가 /api 경로를 FastAPI로 전달하므로 상대 경로 사용
        const res = await fetch('/api/hello');
        const data = await res.json();
        document.getElementById('result').innerText = data.message;
      }

      async function postItem() {
        const res = await fetch('/api/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: 'MacBook', price: 2500000 }),
        });
        const data = await res.json();
        document.getElementById('result').innerText = data.message;
      }
    </script>
  </body>
</html>
